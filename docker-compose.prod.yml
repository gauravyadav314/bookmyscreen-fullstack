version: '3.8'

services:
  mongo:
    image: mongo:6
    container_name: bms_mongo_prod
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:alpine
    container_name: bms_redis_prod
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./bms-backend
      dockerfile: Dockerfile
    container_name: bms_backend_prod
    restart: always
    ports:
      - "9000:9000"
    environment:
      - PORT=9000
      - MONGO_CONNECTION_STRING=mongodb://mongo:27017/bookmyscreen
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FRONTEND_URL=http://localhost
    depends_on:
      - mongo
      - redis

  frontend:
    build:
      context: ./bms-frontend
      dockerfile: Dockerfile
    container_name: bms_frontend_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
